<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Media Vault - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-tertiary: #1f2937;
      --border: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(16,185,129,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(59,130,246,0.06) 0%, transparent 50%);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin-bottom: 16px;
    }
    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .logo p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .form-control::placeholder {
      color: #6b7280;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-danger {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      padding: 0 16px;
    }
    .demo-credentials {
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 16px;
      font-size: 12px;
    }
    .demo-credentials h6 {
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .demo-credentials code {
      color: var(--accent);
      background: rgba(16,185,129,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-vault"></i>
        </div>
        <h1>Enterprise Media Vault</h1>
        <p>Sistema de Gestión Documental Empresarial</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="admin@emv.local" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="btn-text">Iniciar Sesión</span>
        </button>
      </form>

      <div class="divider">
        <span>Demo</span>
      </div>

      <div class="demo-credentials">
        <h6>Credenciales de Prueba</h6>
        <p><strong>Admin:</strong> <code>admin@vault.local</code> / <code>Admin12345!</code></p>
        <p><strong>Usuario:</strong> <code>manager@vault.local</code> / <code>Manager123!</code></p>
        <p><strong>Usuario:</strong> <code>employee@vault.local</code> / <code>Employee123!</code></p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080';
    
    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alert.style.display = 'block';
    }

    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      const btnText = btn.querySelector('.btn-text');
      if (loading) {
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span>Autenticando...';
      } else {
        btn.disabled = false;
        btnText.textContent = 'Iniciar Sesión';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(true);
      showAlert('', '');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Error en la autenticación');
        }

        if (data.success && data.data) {
          const userData = {
            id: data.data.user?.id,
            name: data.data.user?.name || data.data.user?.email,
            email: data.data.user?.email,
            role: data.data.role
          };
          localStorage.setItem('token', data.data.accessToken);
          localStorage.setItem('refreshToken', data.data.refreshToken);
          localStorage.setItem('user', JSON.stringify(userData));
          showAlert('¡Autenticación exitosa! Redirigiendo...', 'success');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1000);
        } else {
          throw new Error(data.message || 'Credenciales inválidas');
        }
      } catch (error) {
        showAlert(error.message, 'danger');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
